[PHP]
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log

; Increase file upload limits
upload_max_filesize = 100M
post_max_size = 100M

; Session settings
session.save_path = "/var/www/html/storage/framework/sessions"

; Date/Time
date.timezone = UTC
