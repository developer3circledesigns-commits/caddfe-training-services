name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, phpcs

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHP syntax check (lint)
        run: find . -name '*.php' ! -path './vendor/*' -exec php -l {} \;

      - name: PHP_CodeSniffer
        run: composer lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "::error::.env file is tracked in Git!"
            exit 1
          fi
          if git ls-files | grep -q 'storage/framework/sessions/'; then
            echo "::error::Session files are tracked in Git!"
            exit 1
          fi

      - name: Check for hardcoded secrets
        run: |
          ! grep -r 'rootpassword' --include='*.yml' --include='*.php' --include='*.sql' --include='*.ini' vendor/ 2>/dev/null | head -5
