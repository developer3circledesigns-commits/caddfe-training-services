services:
  db:
    image: mysql:8.0
    container_name: caddfe-db
    environment:
      MYSQL_DATABASE: u814177917_caddfe
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - public_html_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: caddfe-php
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8084:80"
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/cache:/var/www/html/storage/cache
      - ./storage/framework:/var/www/html/storage/framework
    env_file: .env
    environment:
      DB_HOST: db
    networks:
      - public_html_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: caddfe-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      UPLOAD_LIMIT: 100M
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    ports:
      - "8085:80"
    networks:
      - public_html_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  public_html_network:
    driver: bridge
