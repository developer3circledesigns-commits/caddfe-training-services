services:
  db:
    image: mysql:8.0
    container_name: caddfe_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: u814177917_caddfe
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: caddfe_web
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: u814177917_caddfe
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: caddfe_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      UPLOAD_LIMIT: 100M
      PMA_ABSOLUTE_URI: http://localhost:8085/
    depends_on:
      - db

volumes:
  db_data:
