services:
  db:
    image: mysql:8.0
    container_name: caddfe-db-prod
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: caddfe-php-prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/cache:/var/www/html/storage/cache
      - ./storage/framework:/var/www/html/storage/framework
    env_file: .env
    environment:
      DB_HOST: db
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
